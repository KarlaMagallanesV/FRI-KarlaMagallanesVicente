# kubectl apply -f ms-producto-service.yml
apiVersion: v1
kind: Service
metadata:
  name: ms-producto-service
  namespace: ms-producto-namespace
spec:
  type: LoadBalancer
  ports:
  - name: port-8081
    port: 8081
    targetPort: 8081
  - name: port-9081
    port: 9081
    targetPort: 9081
  selector:
    app: ms-producto
