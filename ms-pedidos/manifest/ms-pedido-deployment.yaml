# kubectl apply -f ms-pedido-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pedido-deployment
  namespace: ms-pedido-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pedido
  template:
    metadata:
      labels:
        app: ms-pedido
    spec:
      containers:
      - name: ms-pedido-container
        image: anyeli/ms-pedido:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        envFrom:
        - secretRef:
            name: ms-pedido-secret           # carga DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, DB_SSL_MODE, SERVER_PORT
